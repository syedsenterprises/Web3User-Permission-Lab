name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ubuntu-24.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "24", "26"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build SDK distribution
        run: npm run build

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Run basic authorization example
        run: npx tsx examples/basic-authorization.ts

      - name: Run persistent replay verification
        run: npm run demo:persistent-replay -- --verify

      - name: Verify package dry-run
        run: npm pack --dry-run --json
